<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title description">
<title id="title">TrenchersPT platform architecture</title>
<desc id="description">The public Chrome frontend contains the dashboard, account popup, and authentication service worker. It connects through REST API v1 and authenticated WebSockets to the private TPTServer backend. The backend uses MongoDB for persistence, Helius and Solana for market data, and Stripe for subscriptions.</desc>
