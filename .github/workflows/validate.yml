name: Frontend Validation

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: frontend-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build injection bundle
        run: npx webpack

      - name: Verify bundle is committed
        run: git diff --exit-code -- Scripts/Injection/inject.bundle.js